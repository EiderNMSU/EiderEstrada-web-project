<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenTech Solutions | Contact</title>
    <style>
        /* Universal Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f1ea;
            color: #333;
            line-height: 1.6;
        }

        .navbar {
            background-color: #2d5a27;
            color: white;
            display: flex;
            justify-content: space-between;
            padding: 15px 5%;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo-text { font-size: 1.8rem; font-weight: bold; }

        .nav-links { list-style: none; display: flex; }
        .nav-links li a { color: white; text-decoration: none; padding: 0 20px; font-weight: 500; }
        .nav-links li a:hover { color: #76a055; }

        #contact-section { padding: 60px 5%; max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #2d5a27; margin-bottom: 30px; }

        .contact-form {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #2d5a27; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 6px; font-size: 1rem; }

        button.submit-btn {
            width: 100%;
            padding: 15px;
            background: #2d5a27;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .info-card {
            text-align: center;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            border-top: 4px solid #76a055;
        }

        footer {
            text-align: center;
            padding: 40px;
            background: #2d5a27;
            color: white;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo-container">
                <img src="../../javascript/javascript/images/logo.jpg" alt="GreenTech Solutions Logo" height="60">
                <span class="logo-text">GreenTech</span>
            </div>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="final.html">The Final</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="contact-section">
        <h1>Get In Touch</h1>
        
        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>

        <div class="info-card">
            <h3>GreenTech Solutions HQ</h3>
            <p>123 Eco Way, El Paso, TX 79901</p>
            <p>Email: contact@greentech.solutions | Phone: (915) 555-0123</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GreenTech Solutions | Built for NMSU ICT 280</p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Form submitted! Thank you for contacting GreenTech Solutions.');
            this.reset();
        });
    </script>
</body>
</html>
